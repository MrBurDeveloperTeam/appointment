<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function () {
      var ALLOWED = { light: true, dark: true, system: true };

      // Read a cookie by name
      function readCookie(name) {
        var parts = document.cookie ? document.cookie.split(';') : [];
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i].trim();
          if (part.indexOf(name + '=') === 0) {
            return decodeURIComponent(part.slice(name.length + 1));
          }
        }
        return null;
      }

      function safeGet(key) {
        try { return window.localStorage.getItem(key); } catch (e) { return null; }
      }

      // Accepts plain string OR Zustand JSON {"state":{"theme":"dark"},"version":0}
      function parseTheme(raw) {
        if (!raw) return null;
        var str = String(raw).trim();
        // Try JSON parse (handles Zustand persist format from app.snabbb.com)
        if (str.charAt(0) === '{') {
          try {
            var p = JSON.parse(str);
            if (p && p.state && p.state.theme) str = p.state.theme;
            else if (p && p.theme) str = p.theme;
            else if (typeof p === 'string') str = p;
          } catch (e) {}
        }
        str = str.trim().toLowerCase();
        return ALLOWED[str] ? str : null;
      }

      function resolveTheme(theme) {
        if (theme === 'system') {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark' : 'light';
        }
        return theme === 'dark' ? 'dark' : 'light';
      }

      // Priority: cookie → localStorage['theme'] → localStorage['snabbb-theme'] (Zustand JSON)
      var theme = parseTheme(readCookie('snabbb-theme'))
               || parseTheme(safeGet('theme'))
               || parseTheme(safeGet('snabbb-theme'))
               || 'light';

      var resolved = resolveTheme(theme);

      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.dataset.themePreference = theme;
      document.documentElement.classList.toggle('dark', resolved === 'dark');
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>

  <title>Appointment BY MR BUR</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
