<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <script>
      (function () {
        var ALLOWED = {
          light: true,
          dark: true,
          system: true
        };

        function readCookie(name) {
          var parts = document.cookie
            ? document.cookie.split(';')
            : [];

          for (var i = 0; i < parts.length; i++) {
            var part = parts[i].trim();

            if (part.indexOf(name + '=') === 0) {
              return decodeURIComponent(
                part.slice(name.length + 1)
              );
            }
          }

          return null;
        }

        function safeGet(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        }

        function parseTheme(raw) {
          if (!raw) return null;

          var value = String(raw).trim().toLowerCase();

          return ALLOWED[value] ? value : null;
        }

        function resolveTheme(theme) {
          if (theme === 'system') {
            return window.matchMedia &&
              window.matchMedia(
                '(prefers-color-scheme: dark)'
              ).matches
              ? 'dark'
              : 'light';
          }

          return theme === 'dark' ? 'dark' : 'light';
        }

        var theme =
          parseTheme(window.__SNABBB_THEME__) ||
          parseTheme(readCookie('snabbb-theme')) ||
          parseTheme(safeGet('theme')) ||
          'light';

        var resolved = resolveTheme(theme);

        document.documentElement.setAttribute(
          'data-theme',
          resolved
        );

        document.documentElement.dataset.themePreference =
          theme;

        document.documentElement.classList.toggle(
          'dark',
          resolved === 'dark'
        );

        document.documentElement.style.colorScheme =
          resolved;
      })();
    </script>

    <title>
      Appointment - Dental Booking &amp; Scheduling
    </title>

    <link
      rel="icon"
      type="image/png"
      href="/assets/appointment.png"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
